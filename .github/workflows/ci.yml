name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile app.py config.py guardrails.py ingest_policies.py rag_engine.py storage.py

      - name: Guardrail red-team tests
        run: pytest -q

      # Ignored advisories affect only ChromaDB's HTTP server (/api/v2 endpoints,
      # multi-tenant RBAC). This app uses the embedded PersistentClient with no
      # server or network port, so they are not exploitable here. No fix exists
      # upstream yet; re-check and remove each ignore once a patched release ships.
      # Details: SECURITY.md -> "Assessed advisories".
      - name: Dependency vulnerability audit
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

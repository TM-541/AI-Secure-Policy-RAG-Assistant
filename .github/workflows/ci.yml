name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile app.py config.py guardrails.py ingest_policies.py rag_engine.py storage.py

      - name: Guardrail red-team tests
        run: pytest -q

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
